name: Build Xiaomi AX3000 (RA80 v2 NSS)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md', '**.md' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt tag or commit to build against'
        required: false
        default: 'v25.12.5'
      make_release:
        description: 'Publish a GitHub release with the images'
        type: boolean
        required: false
        default: true
      ssh_on_failure:
        description: 'Keep the runner alive for debugging if the build fails'
        type: boolean
        required: false
        default: false

env:
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v25.12.5' }}
  TZ: Asia/Shanghai

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: ra80v2-nss

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd libelf-dev \
            u-boot-tools device-tree-compiler
          sudo timedatectl set-timezone "$TZ" || true
          ccache -M 2G
          ccache -o compression=true
          ccache -z

      - name: Restore ccache and dl cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            openwrt/dl
          key: ccache-dl-${{ env.OPENWRT_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-dl-${{ env.OPENWRT_REF }}-

      - name: Checkout OpenWrt ${{ env.OPENWRT_REF }}
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_REF }}
          path: openwrt
          fetch-depth: 0

      - name: Prepare the tree
        run: |
          bash ra80v2-nss/scripts/setup.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Add SONiC fullcone NAT
        env:
          FULLCONE_REPO: https://github.com/mufeng05/openwrt-sonic-fullcone
        run: |
          set -euo pipefail
          git clone --depth 1 "$FULLCONE_REPO" fullcone

          FULLCONE_SHA=$(git -C fullcone rev-parse HEAD)
          git -C fullcone --no-pager log -1 --format='fullcone %h  %ci  %s'
          echo "FULLCONE_COMMIT=$(git -C fullcone rev-parse --short HEAD)" >> "$GITHUB_ENV"

          ( cd openwrt && bash "$GITHUB_WORKSPACE/fullcone/add_sonic_fullcone.sh" ) |
              tee "$RUNNER_TEMP/fullcone.log"

          grep -q '=== Done: [0-9]* applied, 0 skipped ===' "$RUNNER_TEMP/fullcone.log" ||
              { echo "::error::add_sonic_fullcone.sh skipped something"; exit 1; }

          [ "$(git ls-remote "$FULLCONE_REPO" HEAD | cut -f1)" = "$FULLCONE_SHA" ] ||
              { echo "::error::fullcone master moved during this step, re-run it"; exit 1; }

      - name: Add the Vantage theme and ImmortalWrt LuCI plugins
        env:
          VANTAGE_REPO: https://github.com/anothaDev/luci-theme-vantage.git
          IMM_LUCI_REPO: https://github.com/immortalwrt/luci.git
          IMM_CORE_REPO: https://github.com/immortalwrt/immortalwrt.git
        run: |
          set -eu
          git clone --depth 1 "$VANTAGE_REPO" vantage

          VANTAGE_COMMIT=$(git -C vantage rev-parse --short HEAD)
          git -C vantage --no-pager log -1 \
              --format='vantage %h  %ci  %s'
          echo "VANTAGE_COMMIT=$VANTAGE_COMMIT" >> "$GITHUB_ENV"

          cp -a vantage/luci-theme-vantage openwrt/feeds/luci/themes/
          cp -a vantage/luci-app-vantage openwrt/feeds/luci/applications/
          cp -a vantage/luci-app-vantage-traffic openwrt/feeds/luci/applications/

          mkdir -p openwrt/files/etc/apk/keys
          wget -qO openwrt/files/etc/apk/keys/vantage-signing.pem \
              https://anothadev.github.io/luci-theme-vantage/vantage-signing.pem
          echo "c8a6c83eeb49ca2407932fb5e95785776128cef87db75ebaea0fe4171eee2157  openwrt/files/etc/apk/keys/vantage-signing.pem" | sha256sum -c -

          git clone --depth 1 --filter=blob:none --sparse "$IMM_LUCI_REPO" imm-luci
          git -C imm-luci sparse-checkout set \
              applications/luci-app-autoreboot \
              applications/luci-app-cpufreq \
              applications/luci-app-ramfree
          for app in luci-app-autoreboot luci-app-cpufreq luci-app-ramfree; do
            if [ -d "imm-luci/applications/$app" ]; then
              cp -a "imm-luci/applications/$app" openwrt/feeds/luci/applications/
            fi
          done

          git clone --depth 1 --filter=blob:none --sparse "$IMM_CORE_REPO" imm-core
          git -C imm-core sparse-checkout set package/emortal/cpufreq
          if [ -d imm-core/package/emortal/cpufreq ]; then
            mkdir -p openwrt/package/emortal
            cp -a imm-core/package/emortal/cpufreq openwrt/package/emortal/
            sed -i 's|"qualcommax/ipq60xx"|"qualcommax/ipq50xx"\|\\\n\t"qualcommax/ipq60xx"|' \
                openwrt/package/emortal/cpufreq/files/cpufreq.uci 2>/dev/null || true
          fi

          cd openwrt
          ./scripts/feeds update -i luci
          ./scripts/feeds install -a -p luci
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-vantage=y
          CONFIG_PACKAGE_luci-app-vantage-traffic=y
          CONFIG_PACKAGE_luci-i18n-vantage-theme-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vantage-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vantage-traffic-zh-cn=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_cpufreq=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-i18n-cpufreq-zh-cn=y
          CONFIG_PACKAGE_luci-app-autoreboot=y
          CONFIG_PACKAGE_luci-i18n-autoreboot-zh-cn=y
          CONFIG_PACKAGE_luci-app-ramfree=y
          CONFIG_PACKAGE_luci-i18n-ramfree-zh-cn=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Verify the expected packages are selected
        run: |
          cd openwrt
          missing=0
          for sym in \
            CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_ax3000-v2 \
            CONFIG_PACKAGE_ipq-wifi-xiaomi_ax3000-v2 \
            CONFIG_PACKAGE_kmod-qca-nss-drv \
            CONFIG_PACKAGE_kmod-qca-nss-ecm \
            CONFIG_PACKAGE_kmod-qca-mcs \
            CONFIG_PACKAGE_kmod-qca-nss-dp \
            CONFIG_PACKAGE_kmod-qca-ssdk \
            CONFIG_PACKAGE_nss-firmware-ipq50xx \
            CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE \
            CONFIG_NSS_FIRMWARE_VERSION_12_5 \
            CONFIG_PACKAGE_zram-swap \
            CONFIG_PACKAGE_kmod-mtd-rw \
            CONFIG_LUCI_LANG_zh_Hans \
            CONFIG_PACKAGE_luci-i18n-base-zh-cn \
            CONFIG_PACKAGE_luci-theme-vantage \
            CONFIG_PACKAGE_luci-app-vantage \
            CONFIG_PACKAGE_luci-app-vantage-traffic \
            CONFIG_PACKAGE_luci-app-upnp \
            CONFIG_PACKAGE_luci-app-ttyd \
            CONFIG_PACKAGE_luci-app-cpufreq \
            CONFIG_PACKAGE_luci-app-autoreboot \
            CONFIG_PACKAGE_luci-app-ramfree
          do
            if grep -q "^${sym}=y" .config; then
              echo "  ok   $sym"
            else
              echo "  MISS $sym"; missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "config seed did not survive defconfig"; exit 1; }

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | grep -iE '^(Downloading|ERROR|.*failed)' || true
          find dl -size -1024c -type f -print -delete || true

      - name: Build
        id: build
        run: |
          cd openwrt
          make -j$(nproc) || {
            echo "::warning::parallel build failed, retrying single-threaded for a readable log"
            make -j1 V=s
          }
          ccache -s || true

      - name: Save ccache and dl cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            openwrt/dl
          key: ccache-dl-${{ env.OPENWRT_REF }}-${{ github.run_id }}

      - name: Prune old caches to stay well under 10GB limit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR_KEY="ccache-dl-${OPENWRT_REF}-${GITHUB_RUN_ID}"
          gh cache list --limit 100 --json id,key --jq ".[] | select(.key != \"$CUR_KEY\") | .id" |
            while read -r cid; do
              [ -n "$cid" ] && gh cache delete "$cid" || true
            done

      - name: Collect build metadata
        if: success()
        run: |
          cd openwrt
          {
            echo "openwrt_ref=$OPENWRT_REF"
            echo "openwrt_commit=$(git rev-parse --short HEAD)"
            echo "project_commit=$(git -C "$GITHUB_WORKSPACE/ra80v2-nss" rev-parse --short HEAD)"
            echo "vantage_commit=${VANTAGE_COMMIT:-none}"
            echo "fullcone_commit=${FULLCONE_COMMIT:-none}"
            echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } | tee "$GITHUB_WORKSPACE/build-info.txt"
          echo "DATE=$(date '+%Y%m%d_%H%M%S')" >> "$GITHUB_ENV"
          echo "FIRMWARE=$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommax/ipq50xx" >> "$GITHUB_ENV"

      - name: List what was produced
        if: success()
        run: ls -lh "$FIRMWARE" && cat openwrt/bin/targets/qualcommax/ipq50xx/*.manifest | head -40

      - name: Write the release notes
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          IPQ=openwrt/bin/targets/qualcommax/ipq50xx
          {
            echo "OpenWrt \`$OPENWRT_REF\` with Qualcomm NSS (NPU) hardware offload for **Xiaomi AX3000 (RA80 v2)**."
            echo
            echo "| file | use |"
            echo "|---|---|"
            echo "| \`*-squashfs-sysupgrade.bin\` | upgrading a Xiaomi AX3000 (RA80 v2) already running OpenWrt / ImmortalWrt - \`sysupgrade -n\` |"
            echo "| \`*-initramfs-uImage.itb\` | boots from RAM without touching flash, for testing / recovery |"
            echo
            echo "Default LAN address is **192.168.31.1**."
            echo "Default Wi-Fi SSIDs: **Xiaomi-AX3000-2.4G-XXXX** / **Xiaomi-AX3000-5G-XXXX** (password: \`12345678\`)."
            echo
            echo "Includes [SONiC fullcone NAT](https://github.com/mufeng05/openwrt-sonic-fullcone),"
            echo "**off by default**: tick Fullcone NAT under Network > Firewall > General"
            echo "Settings, then in the wan zone's settings."
            echo
            echo '```'
            cat build-info.txt
            echo '```'
            echo
            echo "sha256:"
            echo '```'
            grep -E 'sysupgrade\.bin|initramfs-uImage\.itb' $IPQ/sha256sums || cat $IPQ/sha256sums
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi_ra80v2-nss_${{ env.DATE }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
            build-info.txt
          if-no-files-found: error

      - name: Publish release
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.make_release == 'true'))
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: build-${{ env.DATE }}
          name: Xiaomi AX3000 (RA80v2) NSS ${{ env.DATE }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ env.FIRMWARE }}/*-sysupgrade.bin
            ${{ env.FIRMWARE }}/*-initramfs-uImage.itb
            ${{ env.FIRMWARE }}/*.manifest
            ${{ env.FIRMWARE }}/sha256sums
          fail_on_unmatched_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            openwrt/logs/**
            openwrt/.config
          if-no-files-found: ignore
